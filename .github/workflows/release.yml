name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Extract version from tag
      id: get_version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
        else
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Build and Archive
      run: |
        xcodebuild \
          -project Floatcut.xcodeproj \
          -scheme Floatcut \
          -configuration Release \
          -archivePath build/Floatcut.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO

    - name: Export App
      run: |
        mkdir -p build/Export
        cp -R build/Floatcut.xcarchive/Products/Applications/Floatcut.app build/Export/
        codesign --force --deep --sign - build/Export/Floatcut.app

    - name: Verify Code Signing
      run: |
        echo "=== Code signature ==="
        codesign -dv --verbose=2 build/Export/Floatcut.app
        echo ""
        codesign --verify --verbose build/Export/Floatcut.app

    - name: Create DMG
      run: |
        mkdir -p build/dmg-staging
        cp -R build/Export/Floatcut.app build/dmg-staging/
        ln -s /Applications build/dmg-staging/Applications

        DMG_PATH="$(pwd)/build/Floatcut.dmg"

        hdiutil create \
          -volname "Floatcut" \
          -srcfolder build/dmg-staging \
          -ov \
          -format UDZO \
          "$DMG_PATH"

        ls -lh "$DMG_PATH"

    - name: Generate Release Notes
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        if [ -z "$PREV_TAG" ]; then
          COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
        else
          COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
        fi

        cat > release_notes.md <<EOF
        ## Changes in this release

        $COMMITS

        ## Installation

        1. Download the DMG file below
        2. Open the DMG and drag Floatcut.app to Applications
        3. Launch Floatcut
        4. Grant Accessibility permission when prompted (System Settings > Privacy & Security > Accessibility)

        **Gatekeeper:** Floatcut is ad-hoc signed and not notarized. If macOS blocks
        the first launch, choose System Settings > Privacy & Security > Open Anyway.
        For a trusted app bundle, you can alternatively run:
        \`\`\`bash
        xattr -dr com.apple.quarantine "/Applications/Floatcut.app"
        \`\`\`

        **Upgrading?** If paste stops working after updating, reset the accessibility permission:
        \`\`\`
        tccutil reset Accessibility de.meierkarsten.floatcut
        \`\`\`
        Then re-grant permission to Floatcut and restart the app.

        ## Build Info

        - Signing: ad-hoc signed (not notarized)
        - Requires: macOS 13.5+
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/Floatcut.dmg
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
