name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Check release version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "FLOATCUT_EXPECTED_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
        fi

    - name: Configure Developer ID and notarization
      shell: bash
      env:
        CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
        CERTIFICATE_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
      run: |
        set -euo pipefail
        for variable in CERTIFICATE_P12_BASE64 CERTIFICATE_P12_PASSWORD NOTARY_API_KEY_BASE64 NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
          if [[ -z "${!variable}" ]]; then
            echo "Missing release secret: $variable" >&2
            exit 1
          fi
        done

        KEYCHAIN_PATH="$RUNNER_TEMP/floatcut-signing.keychain-db"
        CERTIFICATE_PATH="$RUNNER_TEMP/floatcut-developer-id.p12"
        API_KEY_PATH="$RUNNER_TEMP/floatcut-notary-api-key.p8"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

        printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
        printf '%s' "$NOTARY_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
        chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_P12_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        xcrun notarytool store-credentials floatcut-release \
          --key "$API_KEY_PATH" \
          --key-id "$NOTARY_API_KEY_ID" \
          --issuer "$NOTARY_API_ISSUER_ID" \
          --keychain "$KEYCHAIN_PATH"
        echo "FLOATCUT_NOTARY_PROFILE=floatcut-release" >> "$GITHUB_ENV"
        echo "FLOATCUT_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

    - name: Build, sign and notarize app and DMG
      shell: bash
      run: bash Scripts/package-notarized-app.sh

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Floatcut_universal_${{ env.FLOATCUT_EXPECTED_VERSION }}.dmg
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove temporary signing credentials
      if: always()
      shell: bash
      run: |
        if [[ -f "$RUNNER_TEMP/floatcut-signing.keychain-db" ]]; then
          security delete-keychain "$RUNNER_TEMP/floatcut-signing.keychain-db"
        fi
        rm -f "$RUNNER_TEMP/floatcut-developer-id.p12" "$RUNNER_TEMP/floatcut-notary-api-key.p8"
